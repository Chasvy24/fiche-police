<style>

}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
[dir="rtl"] body,body[dir="rtl"]{font-family:var(--f-ar)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--header);color:#fff;position:relative;padding-top:env(safe-area-inset-top,0px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--zebra) repeat-x left center/auto 100%}
.top-in{display:flex;align-items:center;gap:12px;padding-block:16px 26px}
.top h1{font-size:1.3rem;font-weight:800;letter-spacing:.01em;line-height:1.15}
.top p{font-size:.82rem;opacity:.85}
.top .grow{flex:1;min-width:0}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:700;cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:var(--header)}
main{padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:1.15rem;font-weight:800}
.card h3{font-size:.95rem;font-weight:800;color:var(--brand-ink);margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.xs{font-size:.78rem}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.9rem}
.note.good{background:var(--good-soft)}
.note.bad{background:var(--bad-soft);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.86rem;font-weight:700;color:var(--muted)}
.field .req{color:var(--wine)}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:16px;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.field.err input,.field.err select,.field.err textarea,.photo.err,.sig.err{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.errmsg{font-size:.8rem;color:var(--bad);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:var(--surface);color:var(--brand-ink);border-color:var(--line-strong)}
.btn.small{min-height:40px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{color:var(--bad);background:var(--surface);border-color:var(--line-strong)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.trav-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:var(--wine);color:#fff;font-weight:800;font-size:.9rem}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.photo{border:2px dashed var(--line-strong);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.photo img{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:var(--surface-2)}
.photo .pick{position:relative;overflow:hidden}
.photo input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.child{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:10px}
.sig{border:1px solid var(--line-strong);border-radius:12px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.check input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px;accent-color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.done-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--good-soft);color:var(--good)}
.done-ic svg{width:30px;height:30px}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;overflow-wrap:anywhere;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.prop{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.prop:first-of-type{border-top:0;padding-top:0}
.prop b{display:block}
details summary{cursor:pointer;font-weight:700;color:var(--brand-ink)}
ol.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.msgbox{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.92rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

async function shareOrDownload(file, { title = "", text = "" } = {}) {
  if (navigator.canShare && navigator.share) {
    let ok = false; try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
    if (ok) { try { await navigator.share({ files: [file], title, text }); return "shared"; } catch (e) { if (e && e.name === "AbortError") return "cancel"; } }
  }
  downloadFile(file); return "downloaded";
}
function downloadFile(file) {
  const url = URL.createObjectURL(file); const a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}

  const l = e.target.closest("[data-lang]");
  if (l && MODE === "guest") { G.lang = l.dataset.lang; saveDraft(); G.done ? (renderLangs(), renderDone()) : renderGuest(); return; }
  const g = e.target.closest("[data-act]"); if (g && MODE === "guest") { guestAction(g); return; }
  const h = e.target.closest("[data-h]"); if (h && MODE === "host") hostAction(h);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (MODE === "host") { if (t.dataset.hk) { H[t.dataset.hk] = t.value; const box = $("#h-link"); if (box) { const link = bookingLink(); box.textContent = link; const m = $("#h-msg"); if (m) m.textContent = HOST_MSG[H.lang].replace("{link}", link); const v = box.parentElement.querySelector("a.btn"); if (v) v.href = link; } } return; }
  if (t.dataset.stay) { G.stay[t.dataset.stay] = t.value; saveDraftSoon(); return; }
  if (t.dataset.t !== undefined && t.dataset.k) {
    const tv = G.travelers[+t.dataset.t]; if (!tv) return;
    if (t.dataset.c !== undefined) tv.children[+t.dataset.c][t.dataset.k] = t.value; else tv[t.dataset.k] = t.value;
    if (G.showErrors) { const fe = t.closest(".field"); if (fe && fe.classList.contains("err") && t.value.trim()) fe.classList.remove("err"); }
    saveDraftSoon();
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (MODE === "host") {
    if (t.id === "h-import" && t.files[0]) { importProps(t.files[0]); t.value = ""; return; }
    if (t.dataset.hk === "sel" || t.dataset.hk === "lang") { H[t.dataset.hk] = t.value; renderHost(); }
    return;
  }
  if (t.id === "consent") { G.consent = t.checked; return; }
  if (t.type === "file" && t.dataset.side) {
    const f = t.files && t.files[0]; if (!f) return;
    try { const img = await compressImage(f); G.travelers[+t.dataset.t].photos[t.dataset.side] = img; renderGuest(); }
    catch (err) { toast(G.lang === "fr" ? "Cette image n'a pas pu être lue. Essayez une photo (JPEG ou PNG)." : G.lang === "ar" ? "تعذّرت قراءة هذه الصورة. جرّبوا صورة أخرى." : "This image could not be read. Try another photo."); }
    return;
  }
  if (t.dataset.k === "docType") { renderGuest(); }
});
if (MODE === "guest") initGuest(params); else initHost();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
</script>
</body>
